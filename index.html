<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Adaptive Palette</title>
  </head>
  <body>
    <!--
      Status line for the AI features: shown only when no models are available.
    -->
    <div id="aiStatus" role="status"></div>

    <!--
      First-run setup: shown only when Ollama is not running or a model the configuration
      asks for has not been downloaded yet.
    -->
    <div id="firstRunSetup"></div>

    <!--
      The top bar: the attributes set on the message being displayed at the left, and at the
      right the buttons for adding symbols and adjusting settings. Each trigger is shown only
      when its section in config.json enables it.
    -->
    <div id="topBar">
      <div id="messageAttributes"></div>
      <div id="symbolEntryToolbar"></div>
    </div>

    <!--
      The current palette. It draws the whole screen below the top bar: the input area, sentence
      choices, word predictions and command bar are cells in it.
    -->
    <div id="mainPaletteDisplayArea">
      <script type="module">
        import "./src/client/index.js";
      </script>
    </div>

    <!-- Dialogs that belong to the page rather than to one palette. -->
    <div id="pageDialogs"></div>
  </body>
</html>
