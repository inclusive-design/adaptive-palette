<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Adaptive Palette</title>
  </head>
  <body>
    <!--
      Status line for the AI features: shown only when no models are available.
    -->
    <div id="aiStatus" role="status"></div>

    <!--
      Triggers for adding a symbol to the message, and the dialogs they open.
      Each trigger is shown only when its section in config.json enables it.
    -->
    <div id="symbolEntryToolbar"></div>

    <!--
      Row 1: navigation out of the current palette, the message being composed, and the
      trigger that turns it into a sentence.
    -->
    <div id="inputArea">
      <div id="input_palette"></div>
    </div>
    <div id="sentenceChoices"></div>
    <!-- Suggested next words. -->
    <div id="predictedWords"></div>

    <!--
      Row 2: message editing commands, indicators, and modifiers, in one short bar.
    -->
    <div id="commandBar"></div>

    <!--
      Row 3: the palette itself, at full page width.
    -->
    <div id="mainPaletteDisplayArea">
      <script type="module">
        import "./src/client/index.js";
      </script>
    </div>
  </body>
</html>
