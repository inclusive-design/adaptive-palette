<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Adaptive Palette</title>
  </head>
  <body>
    <!--
      Status line for the AI features: shown only when no models are available.
    -->
    <div id="aiStatus" role="status"></div>

    <!--
      Triggers for adding a symbol to the message, and the dialogs they open.
      Each trigger is shown only when its section in config.json enables it.
    -->
    <div id="symbolEntryToolbar"></div>

    <!--
      User's main interaction area with the adaptive palette, including the input palette,
      indicators, modifiers, backup palette, and main palette display area.
    -->
    <div id="inputArea">
      <div id="input_palette"></div>
    </div>
    <div id="sentenceChoices"></div>
    <div>
      <div id="indicators"></div>
    </div>
    <div>
      <div id="modifiers"></div>
    </div>
    <div class="oneRow">
      <div id="backup_palette"></div>
      <div id="mainPaletteDisplayArea">
        <script type="module">
          import "./src/client/index.js";
        </script>
      </div>
    </div>
  </body>
</html>
